# L6Desk headless bridge settings. After changing:  sudo systemctl restart l6desk-bridge

# TCP port tablets connect to (the app's default is 5704).
port=5704

# Name shown on the tablet.
name=L6Desk Bridge

# Status LED: auto (the board's activity LED), none, or a /sys/class/leds/<name> directory.
led=auto

# Music player: WAV files in this folder play into the L6max's USB audio (CH7 / CH8 switched to
# USB), controlled from the app's PLAYER panel. Copy songs in with scripts/music-pi.sh. Empty = off.
music=/srv/l6max-music

# Let the app power the Pi off (its "closing the app shuts down the Pi bridge" option). Anyone who
# can connect the app can then do it, so turn it off if others share the Pi's network.
power_off=true

# PIN (4 to 8 digits) the app must give to connect, so a stray phone on the network can't take
# over the desk. Empty = none. The app asks for it once and remembers it.
pin=

# Log every MIDI message from the tablet (noisy; for fault-finding): journalctl -u l6desk-bridge -f
log_midi=false

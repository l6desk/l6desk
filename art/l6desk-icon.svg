<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- L6Desk icon: three fader slots with caps on a dark desk panel. Source of truth for
       every icon size (regenerate with ./gradlew :desktopApp:generateIcons). -->
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A3D42"/>
      <stop offset="1" stop-color="#1F2124"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E6E2D9"/>
      <stop offset="0.48" stop-color="#B9B5AC"/>
      <stop offset="0.52" stop-color="#8E8B84"/>
      <stop offset="1" stop-color="#C9C5BC"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F06A5F"/>
      <stop offset="0.48" stop-color="#C9372D"/>
      <stop offset="0.52" stop-color="#9E241C"/>
      <stop offset="1" stop-color="#E2483D"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#panel)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#000" stroke-opacity="0.5" stroke-width="4"/>
  <!-- slots -->
  <g fill="#050506">
    <rect x="140" y="104" width="16" height="304" rx="8"/>
    <rect x="248" y="104" width="16" height="304" rx="8"/>
    <rect x="356" y="104" width="16" height="304" rx="8"/>
  </g>
  <!-- caps (shadow, body, index line) -->
  <g fill="#000" fill-opacity="0.45">
    <rect x="102" y="262" width="92" height="64" rx="10"/>
    <rect x="210" y="166" width="92" height="64" rx="10"/>
    <rect x="318" y="302" width="92" height="64" rx="10"/>
  </g>
  <rect x="102" y="252" width="92" height="64" rx="10" fill="url(#cap)"/>
  <rect x="210" y="156" width="92" height="64" rx="10" fill="url(#cap)"/>
  <rect x="318" y="292" width="92" height="64" rx="10" fill="url(#red)"/>
  <g fill="#1A1B1D">
    <rect x="110" y="281" width="76" height="6" rx="3"/>
    <rect x="218" y="185" width="76" height="6" rx="3"/>
  </g>
  <rect x="326" y="321" width="76" height="6" rx="3" fill="#FFF6F0"/>
</svg>
